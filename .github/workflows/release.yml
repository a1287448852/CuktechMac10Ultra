name: macOS Build & Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build Universal macOS DMG
    runs-on: macos-26-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          swift --version
          sw_vers

      - name: Run unit tests
        run: swift test

      - name: Build universal binary
        run: bash scripts/build-universal.sh

      - name: Assemble & sign .app
        run: bash scripts/make-app.sh dist .build/release/CuktechMac10Ultra

      - name: Run selftest
        run: dist/CuktechMac10Ultra.app/Contents/MacOS/CuktechMac10Ultra --selftest

      - name: Create DMG & ZIP
        run: |
          bash scripts/make-dmg.sh dist
          bash scripts/package.sh dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CuktechMac10Ultra-macOS
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.dmg dist/*.zip \
            --title "CuktechMac10Ultra ${GITHUB_REF_NAME}" \
            --generate-notes \
            --fail-on-no-files || \
          gh release upload "${GITHUB_REF_NAME}" dist/*.dmg dist/*.zip --clobber
